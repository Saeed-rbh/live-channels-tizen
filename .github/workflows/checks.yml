name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check LiveChannels/app.js
      - run: node --check LiveChannels/player.js
      - run: node tests/categories.cjs
      - run: node tests/football.cjs
      - run: node tests/player.cjs
